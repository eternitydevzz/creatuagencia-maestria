name: Keepalive
# El plan gratuito de Supabase pausa los proyectos tras una semana sin actividad. Este latido (una llamada a una función que solo
# devuelve la hora) lo evita. Configuración, en GitHub → tu repo → Settings → Secrets and variables → Actions:
#   - Variable SUPABASE_URL      = https://TU-REF.supabase.co
#   - Secret   SUPABASE_ANON_KEY = la clave anon (pública) de tu proyecto
# Sin esas dos, el latido no hace nada (no falla).
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Falta SUPABASE_URL (variable) o SUPABASE_ANON_KEY (secret): latido omitido."; exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}')
          echo "Supabase respondió $code"
          test "$code" = "200"
