# Ajustes de autenticación de PRODUCCIÓN (solo lo que declara este archivo; lo demás no se toca).
# Aplicar:  supabase config push --project-ref <ref> --workdir deploy/supabase-prod-auth
# Previsualizar antes:  supabase config diff --project-ref <ref> --workdir deploy/supabase-prod-auth
# OJO: [auth.email] enable_signup = true significa "proveedor de email ACTIVO" (si se pone false, nadie puede iniciar sesión).
#      El registro público se abre o cierra con [auth] enable_signup. Abierto (desde 2026-11-27): quien se registra entra
#      directamente en revisión, sin créditos, hasta que un admin lo aprueba en Alumnos (migración 20261015000002_signup_approval.sql).
project_id = "creatuagencia-maestria"

[auth]
enable_signup = true
site_url = "https://creatuagencia-maestria.vercel.app"
additional_redirect_urls = ["https://creatuagencia-maestria.vercel.app", "https://creatuagencia-maestria.vercel.app/reset-password"]
minimum_password_length = 10

[auth.email]
enable_signup = true
# Sin confirmar el email: el filtro es la aprobación del admin (decisión de Jose, 2026-11-27). Así no hace falta SMTP propio.
enable_confirmations = false
